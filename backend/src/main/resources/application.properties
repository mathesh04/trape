
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

springdotenv.directory=${SPRING_DOTENV_DIR:./}

spring.application.name=trape-backend


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.show-sql=false


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB


app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL}


app.cors.allowed-origins=${CORS_ORIGINS}


app.order.payment-pending-timeout-minutes=15


app.frontend.base-url=${FRONTEND_BASE_URL}


razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.currency=INR

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false


logging.level.root=INFO
logging.level.com.trape.backend=DEBUG
logging.level.org.hibernate.SQL=WARN